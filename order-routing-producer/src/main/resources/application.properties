# Axon Configuration
axon.axonserver.servers=axon-server:8124

# Postgresql
spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# Recreate schema on startup for clean experimental runs
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Web3
web3.provider=${WEB3_PROVIDER}
contract.address=${CONTRACT_ADDRESS}
private.key=${PRIVATE_KEY}

# Spring RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS}
spring.rabbitmq.virtual-host=/

# RabbitMQ Management
rabbit.mgmt.host=http://rabbitmq:15672
rabbit.mgmt.user=${RABBITMQ_DEFAULT_USER}
rabbit.mgmt.pass=${RABBITMQ_DEFAULT_PASS}
rabbit.mgmt.vhost=/

# Logging
logging.level.root=INFO
logging.level.ict.um.orders=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# ML
ml.model-path=classpath:models/xgb-model.bin

# Routing strategy: shortest-queue | little-law | training | ml
routing.strategy=training
training.collection-enabled=true

# Training
training.pending-data-path=/app/data/pending-routing-observations.csv

# Workload arrival intensity
# 2.0 = lower load
# 1.0 = baseline
# 0.25 = higher load
workload.arrival-scale=2.0
# Workload duration
workload.duration-seconds=30
# Workload seed
workload.random-seed=1001

# Experiment
experiment.run-id=${EXPERIMENT_RUN_ID}
experiment.data-directory=/app/data