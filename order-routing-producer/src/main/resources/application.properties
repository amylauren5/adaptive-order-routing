# Axon
axon.axonserver.servers=axon-server:8124

# PostgreSQL
spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Web3
web3.provider=${WEB3_PROVIDER}
contract.address=${CONTRACT_ADDRESS}
private.key=${PRIVATE_KEY}

# RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASS}
spring.rabbitmq.virtual-host=/

# RabbitMQ Management API
rabbit.mgmt.host=http://rabbitmq:15672
rabbit.mgmt.user=${RABBITMQ_USER}
rabbit.mgmt.pass=${RABBITMQ_PASS}
rabbit.mgmt.vhost=/

# Logging
logging.level.root=INFO
logging.level.ict.um.orders=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# ML model artifacts
ml.model-path=classpath:models/xgboost-model.json
ml.schema-path=classpath:models/model-schema.json

# Routing strategy: shortest-queue | little-law | training | ml
routing.strategy=${ROUTING_STRATEGY:training}
training.collection-enabled=${TRAINING_COLLECTION_ENABLED:true}

# Training-data collection
training.pending-data-path=/app/data/pending-routing-observations.csv

# Workload
workload.arrival-scale=${WORKLOAD_ARRIVAL_SCALE:2.0}
workload.duration-seconds=${WORKLOAD_DURATION_SECONDS:30}
workload.random-seed=${WORKLOAD_RANDOM_SEED:1002}
routing.backlog-window-ms=1000

# Burst
workload.burst-enabled=${WORKLOAD_BURST_ENABLED:false}
workload.burst-start-seconds=${WORKLOAD_BURST_START_SECONDS:20}
workload.burst-duration-seconds=${WORKLOAD_BURST_DURATION_SECONDS:5}
workload.burst-multiplier=${WORKLOAD_BURST_MULTIPLIER:1.0}

# Experiment
experiment.run-id=${EXPERIMENT_RUN_ID:training-default}
experiment.data-directory=/app/data

# Evaluation
evaluation.collection-enabled=${EVALUATION_COLLECTION_ENABLED:true}
evaluation.queue-sampling-interval-ms=1000