# Axon
axon.axonserver.servers=axon-server:8124

# PostgreSQL
spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Web3
web3.provider=${WEB3_PROVIDER}
contract.address=${CONTRACT_ADDRESS}
private.key=${PRIVATE_KEY}

# RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS}
spring.rabbitmq.virtual-host=/

# RabbitMQ Management API
rabbit.mgmt.host=http://rabbitmq:15672
rabbit.mgmt.user=${RABBITMQ_DEFAULT_USER}
rabbit.mgmt.pass=${RABBITMQ_DEFAULT_PASS}
rabbit.mgmt.vhost=/

# Logging
logging.level.root=INFO
logging.level.ict.um.orders=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# ML model artifacts
ml.model-path=classpath:models/xgboost-model.json
ml.schema-path=classpath:models/model-schema.json

# Routing strategy: shortest-queue | little-law | training | ml
routing.strategy=little-law
training.collection-enabled=false

# Training-data collection
training.pending-data-path=/app/data/pending-routing-observations.csv

# Workload
workload.arrival-scale=2.0
workload.duration-seconds=60
workload.random-seed=1002

# Burst
workload.burst-enabled=true
workload.burst-start-seconds=20
workload.burst-duration-seconds=10
workload.burst-multiplier=0.25

# Experiment
experiment.run-id=${routing.strategy}-scale${workload.arrival-scale}-seed${workload.random-seed}-burst${workload.burst-multiplier}
experiment.data-directory=/app/data