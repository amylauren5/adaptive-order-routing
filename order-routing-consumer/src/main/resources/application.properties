# Axon
axon.axonserver.servers=axon-server:8124

# PostgreSQL
spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Web3
web3.provider=${WEB3_PROVIDER}
contract.address=${CONTRACT_ADDRESS}
private.key=${PRIVATE_KEY}

# RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS}
spring.rabbitmq.virtual-host=/
spring.rabbitmq.listener.simple.prefetch=1

# Training outcome collection
training.collection-enabled=false
training.outcome-data-path=/app/data/routing-decision-outcomes.csv

# Experiment
experiment.run-id=little-law-scale2.0-seed1002-burst0.25
experiment.data-directory=/app/data