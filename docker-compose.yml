networks:
  ict3500-dissertation_rabbit-network:
    external: true

services:
  producer-app:
    build:
      context: ./order-routing-producer
      dockerfile: Dockerfile
    container_name: producer-app
    environment:
      ROUTING_STRATEGY: ${ROUTING_STRATEGY:-training}
      TRAINING_COLLECTION_ENABLED: ${TRAINING_COLLECTION_ENABLED:-true}
      WORKLOAD_ARRIVAL_SCALE: ${WORKLOAD_ARRIVAL_SCALE:-2.0}
      WORKLOAD_DURATION_SECONDS: ${WORKLOAD_DURATION_SECONDS:-30}
      WORKLOAD_RANDOM_SEED: ${WORKLOAD_RANDOM_SEED:-1002}
      WORKLOAD_BURST_ENABLED: ${WORKLOAD_BURST_ENABLED:-false}
      WORKLOAD_BURST_START_SECONDS: ${WORKLOAD_BURST_START_SECONDS:-20}
      WORKLOAD_BURST_DURATION_SECONDS: ${WORKLOAD_BURST_DURATION_SECONDS:-5}
      WORKLOAD_BURST_MULTIPLIER: ${WORKLOAD_BURST_MULTIPLIER:-1.0}
      ROUTING_QUEUE_STATE_REFRESH_MS: ${ROUTING_QUEUE_STATE_REFRESH_MS:-1000}
      EXPERIMENT_RUN_ID: ${EXPERIMENT_RUN_ID:-training-default}
    env_file:
      - ./scripts/.env
    volumes:
      - ${EXPERIMENT_DATA_DIR:-./data}:/app/data
    ports:
      - "8080:8080"
    networks:
      - ict3500-dissertation_rabbit-network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      axon-server:
        condition: service_healthy

  consumer-app:
    build:
      context: ./order-routing-consumer
      dockerfile: Dockerfile
    container_name: consumer-app
    environment:
      TRAINING_COLLECTION_ENABLED: ${TRAINING_COLLECTION_ENABLED:-true}
      EVALUATION_COLLECTION_ENABLED: ${EVALUATION_COLLECTION_ENABLED:-true}
      EXPERIMENT_RUN_ID: ${EXPERIMENT_RUN_ID:-training-default}
    env_file:
      - ./scripts/.env
    volumes:
      - ${EXPERIMENT_DATA_DIR:-./data}:/app/data
    networks:
      - ict3500-dissertation_rabbit-network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      axon-server:
        condition: service_healthy

  axon-server:
    image: docker.axoniq.io/axoniq/axonserver:2026.0.5
    container_name: axon-server
    hostname: axon-server
    environment:
      AXONIQ_AXONSERVER_STANDALONE: "true"
      axoniq_axonserver_hostname: axon-server
      axoniq_axonserver_internal_hostname: axon-server
    ports:
      - "8024:8024"
      - "8124:8124"
      - "8224:8224"
    networks:
      - ict3500-dissertation_rabbit-network
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8024" ]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbit-broker
    env_file:
      - ./scripts/.env
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - ict3500-dissertation_rabbit-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  postgres:
    image: postgres:14
    container_name: postgres-db
    env_file:
      - ./scripts/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ict3500-dissertation_rabbit-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
